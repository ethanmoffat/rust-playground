version: '3'

vars:
  DISTRO: Ubuntu-24.04
  REPO: /workspaces/rust-playground
  UNC: \\wsl.localhost\{{.DISTRO}}\workspaces\rust-playground

tasks:
  default:
    desc: Delete and recreate WSL, clone the current branch into it, then run the up task
    platforms: [windows]
    cmds:
      - pwsh -NoProfile -NonInteractive -File bootstrap-dev-env.ps1
      - task: up

  up:
    desc: Bootstrap the existing WSL clone, start its devcontainer, and open VS Code (use after a restart)
    platforms: [windows]
    cmds:
      - pwsh -NoProfile -NonInteractive -File initialize-vscode.ps1
      - wsl -d {{.DISTRO}} --cd {{.REPO}} --exec ./dev/bootstrap-dev-env.sh
      - wsl -d {{.DISTRO}} --cd {{.REPO}} --exec npm ci
      # These labels match the ones VS Code uses, so VS Code attaches to this container instead of creating another.
      - >-
        wsl -d {{.DISTRO}} --cd {{.REPO}} --exec npx --no-install devcontainer up --workspace-folder {{.REPO}}
        --id-label 'devcontainer.local_folder={{.UNC}}'
        --id-label 'devcontainer.config_file={{.REPO}}/.devcontainer/devcontainer.json'
      - code --folder-uri 'vscode-remote://dev-container+{{printf "%x" .UNC}}{{.REPO}}'
