[application_database]
host = "127.0.0.1"
port = 14333
database = "arrowcol"
username = "arrowcol_app"
password_file = "projects/arrowcol-infra/secrets/arrowcol-app-password.txt"
trust_server_certificate = true # local development only
connect_timeout_seconds = 15
command_timeout_seconds = 30

[hive_metastore]
host = "127.0.0.1"
port = 9083
warehouse_root = "file:///opt/hive/data/warehouse"
owner = "arrowcol"
connect_timeout_seconds = 10

[ddl]
timestamp_with_time_zone = "UTC"
