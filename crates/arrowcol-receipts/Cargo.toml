[package]
name = "arrowcol-receipts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Durable SQL Server delivery receipts and publication fencing for Arrow collectors"
readme = "README.md"

[dependencies]
arrowcol-catalog = { path = "../arrowcol-catalog" }
arrowcol-protocol = { path = "../arrowcol-protocol" }
arrow-deltalake = { path = "../arrow-deltalake" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
thiserror.workspace = true
tiberius = { version = "0.13", default-features = false, features = ["chrono", "rustls", "tds73"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
anyhow.workspace = true
arrow-schema = { version = "58.3", default-features = false }
futures = "0.3"

[lints]
workspace = true
