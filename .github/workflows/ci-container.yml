name: Source-built CI shard

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      task:
        required: true
        type: string
      key:
        required: true
        type: string
      export-reader:
        type: boolean
        default: false
      integration:
        type: boolean
        default: false
      image-refs:
        type: string
        default: "[]"

permissions:
  contents: read

jobs:
  shard:
    name: ${{ inputs.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Download the shared source environment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-source-environment
          path: .temp/ci/environment
      - name: Load the source-built image
        run: docker load --input .temp/ci/environment/environment.tar.gz

      - name: Restore this shard's Cargo cache
        if: ${{ !inputs.integration && !endsWith(inputs.task, ':format-check') && !endsWith(inputs.task, ':lockfile-check') }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target/ci/build
            target/ci/cargo-registry
            target/ci/cargo-git
          key: cargo-${{ runner.os }}-${{ inputs.key }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.devcontainer/content-hash.txt', '.github/ci/Dockerfile') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ inputs.key }}-

      - name: Download source-built runtime images
        if: inputs.integration
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-image-*
          path: .temp/ci/images
          merge-multiple: true
      - name: Download the independent reader
        if: inputs.integration
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-delta-reader
          path: .temp/ci
      - name: Validate and load the integration artifacts
        if: inputs.integration
        env:
          CI_IMAGE_REFS: ${{ inputs.image-refs }}
        run: npx --no-install nx run tools-scripts:ci-import-integration

      - name: Prepare isolated CI host state
        run: npx --no-install nx run tools-scripts:ci-prepare
      - name: Start the source-built artifact without registry fallback
        id: devcontainer
        env:
          CI_ARTIFACT_IMAGE: ${{ inputs.image }}
        run: npx --no-install nx run tools-scripts:ci-start-artifact
      - name: Verify only this dependency-closed Nx shard
        env:
          CONTAINER_ID: ${{ steps.devcontainer.outputs.container_id }}
          CI_TASK: ${{ inputs.task }}
          CI_INTEGRATION: ${{ inputs.integration }}
        run: npx --no-install nx run tools-scripts:ci-verify

      - name: Export the reader with executable permissions
        if: inputs.export-reader
        env:
          CONTAINER_ID: ${{ steps.devcontainer.outputs.container_id }}
        run: npx --no-install nx run tools-scripts:ci-export-reader
      - name: Share the reader with E2E
        if: inputs.export-reader
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-delta-reader
          path: .temp/ci/reader.tar
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Remove only this job's devcontainer resources
        if: always()
        env:
          CI_LABEL: ${{ steps.devcontainer.outputs.ci_label }}
          COMPOSE_PROJECT: ${{ steps.devcontainer.outputs.compose_project }}
          CONTAINER_ID: ${{ steps.devcontainer.outputs.container_id }}
        run: npx --no-install nx run tools-scripts:ci-cleanup
      - name: Preserve failed integration diagnostics
        if: ${{ failure() && inputs.integration }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: telemetry-e2e-diagnostics-${{ inputs.key }}
          path: onelake/e2e/
          if-no-files-found: ignore
          retention-days: 7
