name: Source-built CI shard

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      task:
        required: true
        type: string
      tasks:
        type: string
        default: ""
      key:
        required: true
        type: string
      export-reader:
        type: boolean
        default: false
      integration:
        type: boolean
        default: false
      image-refs:
        type: string
        default: "[]"

permissions:
  contents: read

jobs:
  shard:
    name: ${{ inputs.task }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Download the shared source environment
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-source-environment
          path: .temp/ci/environment
      - name: Load the source-built image
        run: docker load --input .temp/ci/environment/environment.tar.zst

      - name: Restore shared immutable Cargo sources
        if: ${{ !inputs.integration && (inputs.tasks != '' || (!endsWith(inputs.task, ':format-check') && !endsWith(inputs.task, ':lockfile-check'))) }}
        id: cargo-sources
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/ci/cargo/registry
            target/ci/cargo/git
          key: cargo-sources-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ runner.os }}-
      - name: Restore this shard's compiled Cargo cache
        if: ${{ !inputs.integration && (inputs.tasks != '' || (!endsWith(inputs.task, ':format-check') && !endsWith(inputs.task, ':lockfile-check'))) }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/ci/build
          key: cargo-${{ runner.os }}-${{ inputs.key }}-${{ hashFiles('rust-toolchain.toml', '.devcontainer/content-hash.txt', '.github/ci/Dockerfile') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ inputs.key }}-${{ hashFiles('rust-toolchain.toml', '.devcontainer/content-hash.txt', '.github/ci/Dockerfile') }}-

      - name: Download source-built runtime images
        if: inputs.integration
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-image-*
          path: .temp/ci/images
          merge-multiple: true
      - name: Download the independent reader
        if: inputs.integration
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-delta-reader
          path: .temp/ci
      - name: Validate and load the integration artifacts
        if: inputs.integration
        env:
          CI_IMAGE_REFS: ${{ inputs.image-refs }}
        run: npx --no-install nx run tools-scripts:ci-import-integration

      - name: Prepare isolated CI host state
        run: npx --no-install nx run tools-scripts:ci-prepare
      - name: Start the source-built artifact without registry fallback
        id: devcontainer
        env:
          CI_ARTIFACT_IMAGE: ${{ inputs.image }}
        run: npx --no-install nx run tools-scripts:ci-start-artifact
      - name: Verify only this dependency-closed Nx shard
        env:
          CONTAINER_ID: ${{ steps.devcontainer.outputs.container_id }}
          CI_TASK: ${{ inputs.task }}
          CI_TASKS: ${{ inputs.tasks }}
          CI_INTEGRATION: ${{ inputs.integration }}
        run: npx --no-install nx run tools-scripts:ci-verify
      - name: Save the shared Cargo source cache once
        if: ${{ inputs.key == 'rust-checks' && steps.cargo-sources.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/ci/cargo/registry
            target/ci/cargo/git
          key: ${{ steps.cargo-sources.outputs.cache-primary-key }}

      - name: Export the reader with executable permissions
        if: inputs.export-reader
        env:
          CONTAINER_ID: ${{ steps.devcontainer.outputs.container_id }}
        run: npx --no-install nx run tools-scripts:ci-export-reader
      - name: Share the reader with E2E
        if: inputs.export-reader
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-delta-reader
          path: .temp/ci/reader.tar
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Remove only this job's devcontainer resources
        if: always()
        env:
          CI_LABEL: ${{ steps.devcontainer.outputs.ci_label }}
          COMPOSE_PROJECT: ${{ steps.devcontainer.outputs.compose_project }}
          CONTAINER_ID: ${{ steps.devcontainer.outputs.container_id }}
        run: npx --no-install nx run tools-scripts:ci-cleanup
      - name: Preserve failed integration diagnostics
        if: ${{ failure() && inputs.integration }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telemetry-e2e-diagnostics-${{ inputs.key }}
          path: onelake/e2e/
          if-no-files-found: ignore
          retention-days: 7
