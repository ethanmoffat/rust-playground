[package]
name = "quiver-cli"
description = "Generate and inspect Quiver storage exactly as the Arrowcol Direct collector writes it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
anyhow.workspace = true
arrow = { version = "58.3", default-features = false, features = ["prettyprint"] }
arrow-csv = "58.3"
arrowcol-buffer = { path = "../../crates/arrowcol-buffer" }
arrowcol-catalog = { path = "../../crates/arrowcol-catalog" }
arrowcol-protocol = { path = "../../crates/arrowcol-protocol" }
clap.workspace = true
otel-arrow-dfe-quiver = { path = "../../submodules/otel-arrow/rust/otap-dataflow/crates/quiver", default-features = false, features = ["mmap"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile = "3"

[lints]
workspace = true
