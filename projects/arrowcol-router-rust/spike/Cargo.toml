[workspace]
members = ["."]
resolver = "2"

[package]
name = "arrowcol-router-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
anyhow = "=1.0.104"
arrow = { version = "=60.0.0", default-features = false, features = ["ipc"] }
arrow-flight = "=60.0.0"
async-trait = "=0.1.92"
bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive"] }
futures = "=0.3.34"
pingora = { version = "=0.9.0", features = ["proxy"] }
tokio = { version = "=1.53.2", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "=0.1.19"
tonic = "=0.14.6"

[profile.dev]
debug = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
