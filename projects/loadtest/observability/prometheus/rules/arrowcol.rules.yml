groups:
  - name: arrowcol-comparison
    interval: 2s
    rules:
      - record: arrowcol:received_rows_per_second
        expr: |
          sum by (run_id, scenario, implementation_pool, instance) (
            rate(arrowcol_direct_received_rows_total[30s])
            or
            rate(arrowcol_received_rows_total[30s])
          )
      - record: arrowcol:received_bytes_per_second
        expr: |
          sum by (run_id, scenario, implementation_pool, instance) (
            rate(arrowcol_direct_received_bytes_total[30s])
            or
            rate(arrowcol_received_bytes_total[30s])
          )
      - record: arrowcol:active_streams
        expr: |
          sum by (run_id, scenario, implementation_pool, instance) (
            arrowcol_direct_active_streams
            or
            arrowcol_flight_active_streams
            or
            arrowcol_router_active_streams
          )
      - record: arrowcol:container_cpu_cores
        expr: |
          sum by (run_id, scenario, container_label_com_docker_compose_service) (
            rate(container_cpu_usage_seconds_total{
              container_label_com_docker_compose_service!=""
            }[30s])
          )
      - record: arrowcol:container_network_receive_bytes_per_second
        expr: |
          sum by (run_id, scenario, container_label_com_docker_compose_service) (
            rate(container_network_receive_bytes_total{
              container_label_com_docker_compose_service!=""
            }[30s])
          )
      - record: arrowcol:container_rss_bytes
        expr: |
          max by (run_id, scenario, container_label_com_docker_compose_service) (
            container_memory_rss{
              container_label_com_docker_compose_service!=""
            }
          )
