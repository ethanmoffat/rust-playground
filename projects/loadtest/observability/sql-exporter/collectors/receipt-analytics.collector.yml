collector_name: arrowcol_receipt_analytics
min_interval: 10s

metrics:
  - metric_name: arrowcol_sql_direct_receipts
    type: gauge
    help: Direct delivery receipts by current state, bounded to active or recently updated work.
    key_labels: [implementation_pool, instance, table, receipt_state]
    values: [receipts]
    query_ref: receipt_state

  - metric_name: arrowcol_sql_direct_receipt_rows
    type: gauge
    help: Rows represented by direct receipts in each current state.
    key_labels: [implementation_pool, instance, table, receipt_state]
    values: [rows]
    query_ref: receipt_state

  - metric_name: arrowcol_sql_direct_receipt_arrow_bytes
    type: gauge
    help: Logical Arrow bytes represented by direct receipts in each current state.
    key_labels: [implementation_pool, instance, table, receipt_state]
    values: [arrow_bytes]
    query_ref: receipt_state

  - metric_name: arrowcol_sql_direct_receipts_published_total
    type: counter
    help: Cumulative direct receipts durably published to Delta.
    key_labels: [implementation_pool, instance, table]
    values: [receipts_published_total]
    query_ref: publication_totals

  - metric_name: arrowcol_sql_direct_rows_published_total
    type: counter
    help: Cumulative rows durably published by direct receipts.
    key_labels: [implementation_pool, instance, table]
    values: [rows_published_total]
    query_ref: publication_totals

  - metric_name: arrowcol_sql_direct_bytes_published_total
    type: counter
    help: Cumulative Parquet bytes durably published by direct receipts.
    key_labels: [implementation_pool, instance, table]
    values: [bytes_published_total]
    query_ref: publication_totals

  - metric_name: arrowcol_sql_direct_files_added_total
    type: counter
    help: Cumulative Delta data files added by direct receipts.
    key_labels: [implementation_pool, instance, table]
    values: [files_added_total]
    query_ref: publication_totals

  - metric_name: arrowcol_sql_direct_receipt_failures_total
    type: counter
    help: Cumulative direct receipt failures without receipt identifiers.
    key_labels: [implementation_pool, instance, table, failure_disposition, error_code]
    values: [failures_total]
    query_ref: receipt_failures

  - metric_name: arrowcol_sql_direct_receipt_time_to_publish_seconds
    type: gauge
    help: Recent direct receipt creation-to-publication latency quantiles.
    key_labels: [implementation_pool, instance, table]
    value_label: quantile
    values: [p50, p95, p99, average]
    query_ref: publish_latency

  - metric_name: arrowcol_sql_direct_delta_commit_latency_seconds
    type: gauge
    help: Recent direct receipt flushing-to-published latency quantiles.
    key_labels: [implementation_pool, instance, table]
    value_label: quantile
    values: [p50, p95, p99, average]
    query_ref: delta_commit_latency

  - metric_name: arrowcol_sql_schema_saga_failures_total
    type: counter
    help: Cumulative failed or cancelled schema sagas.
    key_labels: [table, saga_state, operation_kind, error_code]
    values: [failures_total]
    query_ref: schema_failures

  - metric_name: arrowcol_sql_schema_versions
    type: gauge
    help: Catalog schema versions by compatibility and state.
    key_labels: [table, compatibility, schema_state]
    values: [versions]
    query_ref: schema_versions

queries:
  - query_name: receipt_state
    query: |
      SELECT
        receipt.implementation_pool,
        owner.instance_key AS instance,
        CONCAT(table_identity.catalog_name, '.', table_identity.schema_name, '.', table_identity.table_name)
          AS [table],
        receipt.state AS receipt_state,
        COUNT_BIG(*) AS receipts,
        SUM(receipt.row_count) AS rows,
        SUM(receipt.arrow_memory_bytes) AS arrow_bytes
      FROM arrowcol.delivery_receipts AS receipt
      INNER JOIN arrowcol.catalog_tables AS table_identity
        ON table_identity.table_id = receipt.table_id
      INNER JOIN arrowcol.collector_instances AS owner
        ON owner.instance_id = receipt.owner_instance_id
      WHERE receipt.state IN ('accepted', 'buffered', 'flushing')
        OR receipt.updated_at_utc >= DATEADD(hour, -6, SYSUTCDATETIME())
      GROUP BY
        receipt.implementation_pool,
        owner.instance_key,
        table_identity.catalog_name,
        table_identity.schema_name,
        table_identity.table_name,
        receipt.state

  - query_name: publication_totals
    query: |
      SELECT
        receipt.implementation_pool,
        owner.instance_key AS instance,
        CONCAT(table_identity.catalog_name, '.', table_identity.schema_name, '.', table_identity.table_name)
          AS [table],
        COUNT_BIG(*) AS receipts_published_total,
        SUM(receipt.rows_published) AS rows_published_total,
        SUM(receipt.bytes_published) AS bytes_published_total,
        SUM(receipt.data_files_added) AS files_added_total
      FROM arrowcol.delivery_receipts AS receipt
      INNER JOIN arrowcol.catalog_tables AS table_identity
        ON table_identity.table_id = receipt.table_id
      INNER JOIN arrowcol.collector_instances AS owner
        ON owner.instance_id = receipt.owner_instance_id
      WHERE receipt.state = 'published'
      GROUP BY
        receipt.implementation_pool,
        owner.instance_key,
        table_identity.catalog_name,
        table_identity.schema_name,
        table_identity.table_name

  - query_name: receipt_failures
    query: |
      SELECT
        receipt.implementation_pool,
        owner.instance_key AS instance,
        CONCAT(table_identity.catalog_name, '.', table_identity.schema_name, '.', table_identity.table_name)
          AS [table],
        receipt.failure_disposition,
        receipt.error_code,
        COUNT_BIG(*) AS failures_total
      FROM arrowcol.delivery_receipts AS receipt
      INNER JOIN arrowcol.catalog_tables AS table_identity
        ON table_identity.table_id = receipt.table_id
      INNER JOIN arrowcol.collector_instances AS owner
        ON owner.instance_id = receipt.owner_instance_id
      WHERE receipt.state IN ('retryable_failure', 'permanent_failure')
      GROUP BY
        receipt.implementation_pool,
        owner.instance_key,
        table_identity.catalog_name,
        table_identity.schema_name,
        table_identity.table_name,
        receipt.failure_disposition,
        receipt.error_code

  - query_name: publish_latency
    query: |
      WITH durations AS (
        SELECT
          receipt.implementation_pool,
          owner.instance_key AS instance,
          CONCAT(table_identity.catalog_name, '.', table_identity.schema_name, '.', table_identity.table_name)
            AS [table],
          CONVERT(float, DATEDIFF_BIG(microsecond, receipt.created_at_utc, receipt.published_at_utc))
            / 1000000.0 AS duration_seconds
        FROM arrowcol.delivery_receipts AS receipt
        INNER JOIN arrowcol.catalog_tables AS table_identity
          ON table_identity.table_id = receipt.table_id
        INNER JOIN arrowcol.collector_instances AS owner
          ON owner.instance_id = receipt.owner_instance_id
        WHERE receipt.state = 'published'
          AND receipt.published_at_utc >= DATEADD(hour, -6, SYSUTCDATETIME())
      ),
      quantiles AS (
        SELECT
          implementation_pool,
          instance,
          [table],
          PERCENTILE_CONT(0.50) WITHIN GROUP (ORDER BY duration_seconds)
            OVER (PARTITION BY implementation_pool, instance, [table]) AS p50,
          PERCENTILE_CONT(0.95) WITHIN GROUP (ORDER BY duration_seconds)
            OVER (PARTITION BY implementation_pool, instance, [table]) AS p95,
          PERCENTILE_CONT(0.99) WITHIN GROUP (ORDER BY duration_seconds)
            OVER (PARTITION BY implementation_pool, instance, [table]) AS p99,
          AVG(duration_seconds)
            OVER (PARTITION BY implementation_pool, instance, [table]) AS average
        FROM durations
      )
      SELECT DISTINCT implementation_pool, instance, [table], p50, p95, p99, average
      FROM quantiles

  - query_name: delta_commit_latency
    query: |
      WITH event_times AS (
        SELECT
          receipt_id,
          MIN(CASE WHEN to_state = 'flushing' THEN occurred_at_utc END) AS flushing_at_utc,
          MIN(CASE WHEN to_state = 'published' THEN occurred_at_utc END) AS published_at_utc
        FROM arrowcol.receipt_events
        WHERE occurred_at_utc >= DATEADD(hour, -6, SYSUTCDATETIME())
        GROUP BY receipt_id
      ),
      durations AS (
        SELECT
          receipt.implementation_pool,
          owner.instance_key AS instance,
          CONCAT(table_identity.catalog_name, '.', table_identity.schema_name, '.', table_identity.table_name)
            AS [table],
          CONVERT(float, DATEDIFF_BIG(microsecond, event_times.flushing_at_utc, event_times.published_at_utc))
            / 1000000.0 AS duration_seconds
        FROM event_times
        INNER JOIN arrowcol.delivery_receipts AS receipt
          ON receipt.receipt_id = event_times.receipt_id
        INNER JOIN arrowcol.catalog_tables AS table_identity
          ON table_identity.table_id = receipt.table_id
        INNER JOIN arrowcol.collector_instances AS owner
          ON owner.instance_id = receipt.owner_instance_id
        WHERE event_times.flushing_at_utc IS NOT NULL
          AND event_times.published_at_utc IS NOT NULL
      ),
      quantiles AS (
        SELECT
          implementation_pool,
          instance,
          [table],
          PERCENTILE_CONT(0.50) WITHIN GROUP (ORDER BY duration_seconds)
            OVER (PARTITION BY implementation_pool, instance, [table]) AS p50,
          PERCENTILE_CONT(0.95) WITHIN GROUP (ORDER BY duration_seconds)
            OVER (PARTITION BY implementation_pool, instance, [table]) AS p95,
          PERCENTILE_CONT(0.99) WITHIN GROUP (ORDER BY duration_seconds)
            OVER (PARTITION BY implementation_pool, instance, [table]) AS p99,
          AVG(duration_seconds)
            OVER (PARTITION BY implementation_pool, instance, [table]) AS average
        FROM durations
      )
      SELECT DISTINCT implementation_pool, instance, [table], p50, p95, p99, average
      FROM quantiles

  - query_name: schema_failures
    query: |
      SELECT
        CONCAT(table_identity.catalog_name, '.', table_identity.schema_name, '.', table_identity.table_name)
          AS [table],
        saga.state AS saga_state,
        COALESCE(saga.operation_kind, 'legacy') AS operation_kind,
        COALESCE(saga.last_error_code, 'unspecified') AS error_code,
        COUNT_BIG(*) AS failures_total
      FROM arrowcol.schema_change_sagas AS saga
      INNER JOIN arrowcol.catalog_tables AS table_identity
        ON table_identity.table_id = saga.table_id
      WHERE saga.state IN ('failed', 'cancelled')
      GROUP BY
        table_identity.catalog_name,
        table_identity.schema_name,
        table_identity.table_name,
        saga.state,
        saga.operation_kind,
        saga.last_error_code

  - query_name: schema_versions
    query: |
      SELECT
        CONCAT(table_identity.catalog_name, '.', table_identity.schema_name, '.', table_identity.table_name)
          AS [table],
        version.compatibility,
        version.state AS schema_state,
        COUNT_BIG(*) AS versions
      FROM arrowcol.table_schema_versions AS version
      INNER JOIN arrowcol.catalog_tables AS table_identity
        ON table_identity.table_id = version.table_id
      GROUP BY
        table_identity.catalog_name,
        table_identity.schema_name,
        table_identity.table_name,
        version.compatibility,
        version.state
