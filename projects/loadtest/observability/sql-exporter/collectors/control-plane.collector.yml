collector_name: arrowcol_control_plane
min_interval: 2s

metrics:
  - metric_name: arrowcol_sql_collector_info
    type: gauge
    help: Latest routing collector registration by stable instance key.
    key_labels: [implementation_pool, instance, lifecycle_state]
    static_value: 1
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_pressure_snapshot_age_seconds
    type: gauge
    help: Age of the latest collector pressure snapshot.
    key_labels: [implementation_pool, instance]
    values: [snapshot_age_seconds]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_rss_bytes
    type: gauge
    help: Collector RSS recorded in the routing pressure snapshot.
    key_labels: [implementation_pool, instance]
    values: [rss_bytes]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_rss_limit_bytes
    type: gauge
    help: Collector RSS hard limit recorded in the routing pressure snapshot.
    key_labels: [implementation_pool, instance]
    values: [rss_limit_bytes]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_active_streams
    type: gauge
    help: Collector active Arrow Flight streams.
    key_labels: [implementation_pool, instance]
    values: [active_streams]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_active_stream_limit
    type: gauge
    help: Collector configured active-stream limit.
    key_labels: [implementation_pool, instance]
    values: [active_stream_limit]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_received_bytes_total
    type: counter
    help: Cumulative logical Arrow bytes received by the collector.
    key_labels: [implementation_pool, instance]
    values: [received_bytes_total]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_received_rows_total
    type: counter
    help: Cumulative rows received by the collector.
    key_labels: [implementation_pool, instance]
    values: [received_rows_total]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_received_batches_total
    type: counter
    help: Cumulative record batches received by the collector.
    key_labels: [implementation_pool, instance]
    values: [received_batches_total]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_buffered_bytes
    type: gauge
    help: Logical Arrow bytes retained or in flight.
    key_labels: [implementation_pool, instance]
    values: [buffered_bytes]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_buffered_rows
    type: gauge
    help: Rows retained or in flight.
    key_labels: [implementation_pool, instance]
    values: [buffered_rows]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_buffered_batches
    type: gauge
    help: Record batches retained or in flight.
    key_labels: [implementation_pool, instance]
    values: [buffered_batches]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_oldest_buffer_age_seconds
    type: gauge
    help: Age of the oldest buffered delivery.
    key_labels: [implementation_pool, instance]
    values: [oldest_buffer_age_seconds]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_pending_commits
    type: gauge
    help: Delta publication attempts pending for the collector.
    key_labels: [implementation_pool, instance]
    values: [pending_commits]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_maximum_pressure_ratio
    type: gauge
    help: Maximum bounded routing pressure input across collector subsystems.
    key_labels: [implementation_pool, instance]
    values: [maximum_pressure_ratio]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_accepting_deliveries
    type: gauge
    help: Whether the collector pressure document allows new deliveries.
    key_labels: [implementation_pool, instance]
    values: [accepting_deliveries]
    query_ref: latest_pressure

  - metric_name: arrowcol_sql_collector_subsystem_info
    type: gauge
    help: Current collector subsystem state.
    key_labels: [implementation_pool, instance, subsystem, subsystem_state]
    static_value: 1
    query_ref: subsystem_state

  - metric_name: arrowcol_sql_table_active_streams
    type: gauge
    help: Table-scoped active streams reported to the router.
    key_labels: [implementation_pool, instance, table]
    values: [active_streams]
    query_ref: table_pressure

  - metric_name: arrowcol_sql_table_buffered_bytes
    type: gauge
    help: Table-scoped buffered logical Arrow bytes.
    key_labels: [implementation_pool, instance, table]
    values: [buffered_bytes]
    query_ref: table_pressure

  - metric_name: arrowcol_sql_table_buffered_rows
    type: gauge
    help: Table-scoped buffered rows.
    key_labels: [implementation_pool, instance, table]
    values: [buffered_rows]
    query_ref: table_pressure

  - metric_name: arrowcol_sql_table_buffered_batches
    type: gauge
    help: Table-scoped buffered record batches.
    key_labels: [implementation_pool, instance, table]
    values: [buffered_batches]
    query_ref: table_pressure

  - metric_name: arrowcol_sql_table_oldest_buffer_age_seconds
    type: gauge
    help: Table-scoped oldest buffered delivery age.
    key_labels: [implementation_pool, instance, table]
    values: [oldest_buffer_age_seconds]
    query_ref: table_pressure

  - metric_name: arrowcol_sql_table_pending_commits
    type: gauge
    help: Table-scoped pending Delta commits.
    key_labels: [implementation_pool, instance, table]
    values: [pending_commits]
    query_ref: table_pressure

  - metric_name: arrowcol_sql_routing_lease_info
    type: gauge
    help: Current routing table ownership without lease or receipt identifiers.
    key_labels: [implementation_pool, table, holder_instance, lease_state]
    static_value: 1
    query_ref: routing_leases

  - metric_name: arrowcol_sql_routing_lease_age_seconds
    type: gauge
    help: Age of the current routing lease.
    key_labels: [implementation_pool, table, holder_instance, lease_state]
    values: [lease_age_seconds]
    query_ref: routing_leases

  - metric_name: arrowcol_sql_routing_lease_seconds_to_expiry
    type: gauge
    help: Time until current routing lease expiry.
    key_labels: [implementation_pool, table, holder_instance, lease_state]
    values: [seconds_to_expiry]
    query_ref: routing_leases

  - metric_name: arrowcol_sql_routing_lease_version
    type: gauge
    help: Monotonic routing lease version used to observe churn.
    key_labels: [implementation_pool, table]
    values: [lease_version]
    query_ref: routing_leases

  - metric_name: arrowcol_sql_routing_fencing_epoch
    type: gauge
    help: Current routing fencing epoch.
    key_labels: [implementation_pool, table]
    values: [fencing_epoch]
    query_ref: routing_leases

queries:
  - query_name: latest_pressure
    query: |
      WITH ranked AS (
        SELECT
          rc.instance_key,
          rc.implementation_pool,
          rc.state AS lifecycle_state,
          rc.heartbeat_at_utc,
          rp.*,
          ROW_NUMBER() OVER (
            PARTITION BY rc.instance_key
            ORDER BY rc.heartbeat_at_utc DESC, rc.started_at_utc DESC
          ) AS rank_number
        FROM arrowcol.routing_collectors AS rc
        INNER JOIN arrowcol.routing_pressure_latest AS rp
          ON rp.collector_instance_id = rc.instance_id
      )
      SELECT
        implementation_pool,
        instance_key AS instance,
        lifecycle_state,
        CONVERT(float, DATEDIFF_BIG(millisecond, observed_at_utc, SYSUTCDATETIME())) / 1000.0
          AS snapshot_age_seconds,
        rss_bytes,
        rss_limit_bytes,
        active_streams,
        active_stream_limit,
        received_bytes AS received_bytes_total,
        received_rows AS received_rows_total,
        received_batches AS received_batches_total,
        buffered_bytes,
        buffered_rows,
        buffered_batches,
        CONVERT(float, oldest_buffer_age_ms) / 1000.0 AS oldest_buffer_age_seconds,
        pending_commits,
        (
          SELECT MAX(pressure_value)
          FROM (VALUES
            (CONVERT(float, cpu_utilization_bps)),
            (10000.0 * CONVERT(float, rss_bytes) / NULLIF(CONVERT(float, rss_limit_bytes), 0)),
            (10000.0 * CONVERT(float, active_streams) / NULLIF(CONVERT(float, active_stream_limit), 0)),
            (10000.0 * CONVERT(float, buffered_bytes) / NULLIF(CONVERT(float, buffered_bytes_limit), 0)),
            (10000.0 * CONVERT(float, buffered_rows) / NULLIF(CONVERT(float, buffered_rows_limit), 0)),
            (10000.0 * CONVERT(float, buffered_batches) / NULLIF(CONVERT(float, buffered_batches_limit), 0)),
            (10000.0 * (CONVERT(float, permit_limit) - CONVERT(float, available_permits))
              / NULLIF(CONVERT(float, permit_limit), 0)),
            (10000.0 * CONVERT(float, pending_commits) / NULLIF(CONVERT(float, pending_commit_limit), 0)),
            (CONVERT(float, delta_pressure_bps)),
            (CONVERT(float, quiver_pressure_bps)),
            (CONVERT(float, dfe_pressure_bps))
          ) AS pressure(pressure_value)
        ) / 10000.0 AS maximum_pressure_ratio,
        CASE WHEN accepting_deliveries = 1 THEN 1 ELSE 0 END AS accepting_deliveries
      FROM ranked
      WHERE rank_number = 1

  - query_name: subsystem_state
    query: |
      WITH ranked AS (
        SELECT
          rc.instance_key,
          rc.implementation_pool,
          rc.heartbeat_at_utc,
          rp.delta_state,
          rp.quiver_state,
          rp.dfe_state,
          ROW_NUMBER() OVER (
            PARTITION BY rc.instance_key
            ORDER BY rc.heartbeat_at_utc DESC, rc.started_at_utc DESC
          ) AS rank_number
        FROM arrowcol.routing_collectors AS rc
        INNER JOIN arrowcol.routing_pressure_latest AS rp
          ON rp.collector_instance_id = rc.instance_id
      )
      SELECT
        ranked.implementation_pool,
        ranked.instance_key AS instance,
        subsystem.subsystem,
        subsystem.subsystem_state
      FROM ranked
      CROSS APPLY (VALUES
        ('delta', ranked.delta_state),
        ('quiver', ranked.quiver_state),
        ('dfe', ranked.dfe_state)
      ) AS subsystem(subsystem, subsystem_state)
      WHERE ranked.rank_number = 1

  - query_name: table_pressure
    query: |
      WITH ranked AS (
        SELECT
          rc.instance_key,
          rc.implementation_pool,
          rc.heartbeat_at_utc,
          rp.table_pressure_json,
          ROW_NUMBER() OVER (
            PARTITION BY rc.instance_key
            ORDER BY rc.heartbeat_at_utc DESC, rc.started_at_utc DESC
          ) AS rank_number
        FROM arrowcol.routing_collectors AS rc
        INNER JOIN arrowcol.routing_pressure_latest AS rp
          ON rp.collector_instance_id = rc.instance_id
      )
      SELECT
        ranked.implementation_pool,
        ranked.instance_key AS instance,
        CONCAT(
          table_pressure.catalog_name, '.',
          table_pressure.schema_name, '.',
          table_pressure.table_name
        ) AS [table],
        table_pressure.active_streams,
        table_pressure.buffered_bytes,
        table_pressure.buffered_rows,
        table_pressure.buffered_batches,
        CONVERT(float, table_pressure.oldest_buffer_age_ms) / 1000.0
          AS oldest_buffer_age_seconds,
        table_pressure.pending_commits
      FROM ranked
      CROSS APPLY OPENJSON(ranked.table_pressure_json)
      WITH (
        catalog_name nvarchar(128) '$.table.catalog',
        schema_name nvarchar(128) '$.table.schema',
        table_name nvarchar(128) '$.table.table',
        active_streams bigint '$.active_streams',
        buffered_bytes bigint '$.buffered_bytes',
        buffered_rows bigint '$.buffered_rows',
        buffered_batches bigint '$.buffered_batches',
        oldest_buffer_age_ms bigint '$.oldest_buffer_age_ms',
        pending_commits bigint '$.pending_commits'
      ) AS table_pressure
      WHERE ranked.rank_number = 1

  - query_name: routing_leases
    query: |
      SELECT
        lease.implementation_pool,
        CONCAT(lease.catalog_name, '.', lease.schema_name, '.', lease.table_name) AS [table],
        holder.instance_key AS holder_instance,
        lease.state AS lease_state,
        CONVERT(float, DATEDIFF_BIG(millisecond, lease.issued_at_utc, SYSUTCDATETIME())) / 1000.0
          AS lease_age_seconds,
        CONVERT(float, DATEDIFF_BIG(millisecond, SYSUTCDATETIME(), lease.expires_at_utc)) / 1000.0
          AS seconds_to_expiry,
        lease.lease_version,
        lease.fencing_epoch
      FROM arrowcol.routing_table_leases AS lease
      INNER JOIN arrowcol.routing_collectors AS holder
        ON holder.instance_id = lease.holder_instance_id
