modules:
  dfe_capabilities:
    metrics:
      - name: arrowcol_dfe_native_quiver_supported
        help: Whether the DFE collector supports native Quiver for arbitrary Arrow payloads.
        path: '{.native_quiver.supported}'
        labels:
          completion_mode: '{.completion_mode}'
          delivery_guarantee: '{.delivery_guarantee}'
          feature_gap: '{.native_quiver.feature_gap}'
      - name: arrowcol_dfe_receipt_polling_supported
        help: Whether the DFE collector exposes SQL delivery receipt polling.
        path: '{.receipt_polling}'
      - name: arrowcol_dfe_sql_delivery_receipts_supported
        help: Whether the DFE collector persists SQL delivery receipts.
        path: '{.sql_delivery_receipts}'
      - name: arrowcol_dfe_at_least_once_supported
        help: Whether the DFE collector advertises at-least-once completion.
        path: '{.at_least_once}'
      - name: arrowcol_dfe_arbitrary_arrow_supported
        help: Whether the DFE collector accepts arbitrary registered Arrow tables.
        path: '{.arbitrary_arrow}'
      - name: arrowcol_dfe_max_concurrent_streams
        help: Configured DFE collector concurrent stream limit.
        path: '{.max_concurrent_streams}'

  dfe_pressure:
    metrics:
      - name: arrowcol_dfe_channel_capacity
        help: Configured bounded DFE channel capacity.
        path: '{.dfe_channel_capacity}'
      - name: arrowcol_dfe_channel_occupancy
        help: Ack-tracked end-to-end DFE channel occupancy.
        path: '{.dfe_channel_occupancy}'
        labels:
          source: '{.dfe_channel_occupancy_source}'
      - name: arrowcol_dfe_actual_rss_bytes
        help: Actual process RSS before routing-pressure bounding.
        path: '{.actual_rss_bytes}'
      - name: arrowcol_dfe_table
        type: object
        help: Bounded DFE table publication and schema-version observations.
        path: '{.table_versions[*]}'
        labels:
          catalog: '{.table.catalog}'
          schema: '{.table.schema}'
          table: '{.table.table}'
        values:
          publication_failures: '{.publication_failures}'
