services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        run_id="$$(printf '%s' "$${LOADTEST_RUN_ID:-local}" | tr -cd '[:alnum:]_.-')"
        scenario="$$(printf '%s' "$${LOADTEST_OBSERVABILITY_SCENARIO:-comparison}" | tr -cd '[:alnum:]_.-')"
        test -n "$$run_id" || run_id=local
        test -n "$$scenario" || scenario=comparison
        sed \
          -e "s|__RUN_ID__|$$run_id|g" \
          -e "s|__SCENARIO__|$$scenario|g" \
          /etc/prometheus/prometheus.yml.tmpl > /prometheus/prometheus.yml
        exec /bin/prometheus \
          --config.file=/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus/data \
          --storage.tsdb.retention.time=6h \
          --storage.tsdb.retention.size=4GB \
          --storage.tsdb.wal-compression \
          --web.enable-lifecycle \
          --web.enable-remote-write-receiver \
          --web.listen-address=0.0.0.0:9090
    environment:
      LOADTEST_RUN_ID: ${LOADTEST_RUN_ID:-local}
      LOADTEST_OBSERVABILITY_SCENARIO: ${LOADTEST_OBSERVABILITY_SCENARIO:-comparison}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
    tmpfs:
      - /prometheus:size=4g,mode=0770,uid=65534,gid=65534
    networks:
      default:
        ipv4_address: 10.89.0.100
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "2"

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/arrow-flight/arrow-flight-platform.json
      GF_LOG_MODE: console
      GF_LOG_LEVEL: warn
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-arrowcol-local}
      GF_USERS_DEFAULT_THEME: dark
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    tmpfs:
      - /var/lib/grafana:size=256m,mode=0770,uid=472,gid=0,exec
      - /var/log/grafana:size=64m,mode=0770,uid=472,gid=0
      - /tmp:size=64m,mode=1777
    networks:
      default:
        ipv4_address: 10.89.0.101
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "2"

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
    tmpfs:
      - /loki:size=2g,mode=0770,uid=10001,gid=10001
    networks:
      default:
        ipv4_address: 10.89.0.102
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "2"

  tempo:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    tmpfs:
      - /var/tempo:size=2g,mode=0770,uid=10001,gid=10001
    networks:
      default:
        ipv4_address: 10.89.0.103
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "2"

  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    environment:
      LOADTEST_RUN_ID: ${LOADTEST_RUN_ID:-local}
      LOADTEST_OBSERVABILITY_SCENARIO: ${LOADTEST_OBSERVABILITY_SCENARIO:-comparison}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /var/lib/alloy:size=256m,mode=0755
    networks:
      default:
        ipv4_address: 10.89.0.104
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "2"

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    command:
      - --docker_only=true
      - --housekeeping_interval=2s
      - --max_housekeeping_interval=2s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    tmpfs:
      - /var/lib/cadvisor:size=64m,mode=0755
    networks:
      default:
        ipv4_address: 10.89.0.105
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "2"

  sql-exporter:
    image: burningalchemist/sql_exporter:0.24.9@sha256:6c554722faccd4b54342ccd765f87b26e8e65fba2a8cddc60bec6de336ecf2e0
    entrypoint: ["/bin/sh", "-ec"]
    user: "0:0"
    command:
      - |
        password="$$(tr -d '\r\n' </run/secrets/arrowcol-app-password)"
        encoded="$$(printf '%s' "$$password" | sed \
          -e 's/%/%25/g' \
          -e 's/+/%2B/g' \
          -e 's|/|%2F|g' \
          -e 's/=/%3D/g')"
        export SQLEXPORTER_TARGET_DSN="sqlserver://arrowcol_app:$${encoded}@sqlserver:1433/arrowcol?encrypt=true&TrustServerCertificate=true"
        exec chpst -u nobody:nobody \
          /bin/sql_exporter --config.file=/etc/sql-exporter/sql_exporter.yml
    secrets:
      - source: arrowcol_app_password
        target: arrowcol-app-password
    volumes:
      - ./observability/sql-exporter/sql_exporter.yml:/etc/sql-exporter/sql_exporter.yml:ro
      - ./observability/sql-exporter/collectors:/etc/sql-exporter/collectors:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      default:
        ipv4_address: 10.89.0.106
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "2"

  json-exporter:
    image: quay.io/prometheuscommunity/json-exporter:v0.8.0@sha256:3aad20d41a0b31dfaaf7ab1a091440e92a82a61ef68b76750eac0ad50a983652
    command: ["--config.file=/etc/json-exporter/config.yml"]
    volumes:
      - ./observability/json-exporter/config.yml:/etc/json-exporter/config.yml:ro
    networks:
      default:
        ipv4_address: 10.89.0.107
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "2"

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.29.0@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      default:
        ipv4_address: 10.89.0.108
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: 10m
        max-file: "2"

secrets:
  arrowcol_app_password:
    file: ${ARROWCOL_APP_PASSWORD_FILE:-../arrowcol-infra/secrets/arrowcol-app-password.txt}
