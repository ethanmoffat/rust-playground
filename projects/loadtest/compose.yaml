services:
  otelcol-rust:
    image: ghcr.io/mdrakiburrahman/rust-playground/otelcol-rust:dev
    pull_policy: never
    user: "${LOADTEST_UID:?Run through Nx}:${LOADTEST_GID:?Run through Nx}"
    command: ["--num-cores", "${LOADTEST_CORES:-2}", "--http-admin-bind", "0.0.0.0:8080", "--config", "/etc/otelcol-rust/config.yaml"]
    volumes:
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}
        target: /onelake
        bind:
          create_host_path: false
    stop_grace_period: 30s
  hello-world:
    image: ghcr.io/mdrakiburrahman/rust-playground/hello-world:dev
    pull_policy: never
    depends_on:
      otelcol-rust:
        condition: service_healthy
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol-rust:4318
      OTEL_SERVICE_NAME: hello-world
      RUST_LOG: info
    command: ["--telemetry", "--repeat", "--interval-ms", "1000", "--run-id", "demo"]
    stop_grace_period: 30s

  sqlserver:
    profiles: ["benchmark"]
    image: arrowcol-loadtest/sqlserver:2022-cu27
    build:
      context: ../arrowcol-infra
      dockerfile: docker/sqlserver/Dockerfile
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: ${SQLSERVER_MEMORY_LIMIT_MB:-2048}
      MSSQL_SA_PASSWORD_FILE: /run/secrets/sqlserver_sa_password
    secrets:
      - sqlserver_sa_password
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/usr/local/bin/sqlserver-healthcheck"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 40s
    networks:
      default:
        ipv4_address: ${LOADTEST_SQL_IP:-10.89.0.2}
    init: true
    stop_grace_period: ${STACK_STOP_SECONDS:-30}s

  database-bootstrap:
    profiles: ["benchmark"]
    image: arrowcol-loadtest/sqlserver:2022-cu27
    build:
      context: ../arrowcol-infra
      dockerfile: docker/sqlserver/Dockerfile
    entrypoint: ["/usr/local/bin/database-bootstrap"]
    command: []
    environment:
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: "1433"
      SQLSERVER_SA_PASSWORD_FILE: /run/secrets/sqlserver_sa_password
      ARROWCOL_APP_PASSWORD_FILE: /run/secrets/arrowcol_app_password
      ARROWCOL_MIGRATOR_PASSWORD_FILE: /run/secrets/arrowcol_migrator_password
      HIVE_METASTORE_PASSWORD_FILE: /run/secrets/hive_metastore_password
    secrets:
      - sqlserver_sa_password
      - arrowcol_app_password
      - arrowcol_migrator_password
      - hive_metastore_password
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  arrowcol-migrate:
    profiles: ["benchmark"]
    image: arrowcol-loadtest/sqlserver:2022-cu27
    build:
      context: ../arrowcol-infra
      dockerfile: docker/sqlserver/Dockerfile
    entrypoint: ["/usr/local/bin/arrowcol-migrate"]
    command: []
    environment:
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: "1433"
      ARROWCOL_MIGRATOR_PASSWORD_FILE: /run/secrets/arrowcol_migrator_password
    secrets:
      - arrowcol_migrator_password
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  hive-schema:
    profiles: ["benchmark"]
    image: arrowcol-loadtest/hive:4.0.1-mssql
    build:
      context: ../arrowcol-infra
      dockerfile: docker/hive/Dockerfile
    command: ["schema-init"]
    environment:
      HIVE_DB_HOST: sqlserver
      HIVE_DB_PORT: "1433"
      HIVE_DB_NAME: hive_metastore
      HIVE_DB_USER: hive_metastore
      HIVE_DB_PASSWORD_FILE: /run/secrets/hive_metastore_password
    secrets:
      - hive_metastore_password
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  hive-metastore:
    profiles: ["benchmark"]
    image: arrowcol-loadtest/hive:4.0.1-mssql
    build:
      context: ../arrowcol-infra
      dockerfile: docker/hive/Dockerfile
    command: ["service"]
    environment:
      SERVICE_NAME: metastore
      IS_RESUME: "true"
      DB_DRIVER: mssql
      METASTORE_PORT: "9083"
      HIVE_DB_HOST: sqlserver
      HIVE_DB_PORT: "1433"
      HIVE_DB_NAME: hive_metastore
      HIVE_DB_USER: hive_metastore
      HIVE_DB_PASSWORD_FILE: /run/secrets/hive_metastore_password
    secrets:
      - hive_metastore_password
    volumes:
      - hive-warehouse:/opt/hive/data/warehouse
    healthcheck:
      test: ["CMD", "/usr/local/bin/hive-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      arrowcol-migrate:
        condition: service_completed_successfully
      hive-schema:
        condition: service_completed_successfully
    networks:
      default:
        ipv4_address: ${LOADTEST_HIVE_IP:-10.89.0.3}
    init: true
    stop_grace_period: ${STACK_STOP_SECONDS:-30}s

  direct-1:
    profiles: ["benchmark"]
    image: ghcr.io/mdrakiburrahman/rust-playground/arrowcol-rust:dev
    pull_policy: never
    user: "${LOADTEST_UID:?Run through Nx}:${LOADTEST_GID:?Run through Nx}"
    command: ["--config", "/state/direct.yaml"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${LOADTEST_TRACES_ENDPOINT:-http://tempo:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    secrets:
      - source: arrowcol_app_password
        target: arrowcol-app-password
      - source: internal_hmac
        target: internal-hmac
    volumes:
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/direct
        target: /delta/direct
        bind:
          create_host_path: false
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/direct-state-1
        target: /state
        bind:
          create_host_path: false
    depends_on:
      hive-metastore:
        condition: service_healthy
    networks:
      default:
        ipv4_address: ${LOADTEST_DIRECT_1_IP:-10.89.0.21}
    stop_grace_period: 5m

  direct-2:
    profiles: ["benchmark"]
    extends: direct-1
    networks:
      default:
        ipv4_address: ${LOADTEST_DIRECT_2_IP:-10.89.0.22}
    volumes:
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/direct
        target: /delta/direct
        bind:
          create_host_path: false
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/direct-state-2
        target: /state
        bind:
          create_host_path: false

  direct-3:
    profiles: ["benchmark"]
    extends: direct-1
    networks:
      default:
        ipv4_address: ${LOADTEST_DIRECT_3_IP:-10.89.0.23}
    volumes:
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/direct
        target: /delta/direct
        bind:
          create_host_path: false
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/direct-state-3
        target: /state
        bind:
          create_host_path: false

  dataflow-1:
    profiles: ["benchmark"]
    image: ghcr.io/mdrakiburrahman/rust-playground/arrowcol-dataflow-rust:dev
    pull_policy: never
    user: "${LOADTEST_UID:?Run through Nx}:${LOADTEST_GID:?Run through Nx}"
    environment:
      ARROWCOL_INSTANCE_KEY: loadtest-dataflow-1
      ARROWCOL_ADVERTISED_FLIGHT_ENDPOINT: ${LOADTEST_DATAFLOW_1_IP:-10.89.0.31}:32010
      ARROWCOL_DELTA_ROOT: /delta/dataflow
      ARROWCOL_SQL_HOST: sqlserver
      ARROWCOL_HIVE_HOST: hive-metastore
      ARROWCOL_MAX_MESSAGE_BYTES: "33554432"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${LOADTEST_TRACES_ENDPOINT:-http://tempo:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    secrets:
      - source: arrowcol_app_password
        target: arrowcol-app-password
    volumes:
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/dataflow
        target: /delta/dataflow
        bind:
          create_host_path: false
    depends_on:
      hive-metastore:
        condition: service_healthy
    networks:
      default:
        ipv4_address: ${LOADTEST_DATAFLOW_1_IP:-10.89.0.31}
    stop_grace_period: 5m

  dataflow-2:
    profiles: ["benchmark"]
    extends: dataflow-1
    environment:
      ARROWCOL_INSTANCE_KEY: loadtest-dataflow-2
      ARROWCOL_ADVERTISED_FLIGHT_ENDPOINT: ${LOADTEST_DATAFLOW_2_IP:-10.89.0.32}:32010
      ARROWCOL_DELTA_ROOT: /delta/dataflow
      ARROWCOL_SQL_HOST: sqlserver
      ARROWCOL_HIVE_HOST: hive-metastore
    networks:
      default:
        ipv4_address: ${LOADTEST_DATAFLOW_2_IP:-10.89.0.32}

  dataflow-3:
    profiles: ["benchmark"]
    extends: dataflow-1
    environment:
      ARROWCOL_INSTANCE_KEY: loadtest-dataflow-3
      ARROWCOL_ADVERTISED_FLIGHT_ENDPOINT: ${LOADTEST_DATAFLOW_3_IP:-10.89.0.33}:32010
      ARROWCOL_DELTA_ROOT: /delta/dataflow
      ARROWCOL_SQL_HOST: sqlserver
      ARROWCOL_HIVE_HOST: hive-metastore
    networks:
      default:
        ipv4_address: ${LOADTEST_DATAFLOW_3_IP:-10.89.0.33}

  router:
    profiles: ["benchmark"]
    image: ghcr.io/mdrakiburrahman/rust-playground/arrowcol-router-rust:dev
    pull_policy: never
    user: "${LOADTEST_UID:?Run through Nx}:${LOADTEST_GID:?Run through Nx}"
    command: ["--config", "/state/config.yaml"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${LOADTEST_TRACES_ENDPOINT:-http://tempo:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    secrets:
      - source: arrowcol_app_password
        target: arrowcol-app-password
      - source: edge_hmac
        target: edge-hmac
      - source: internal_hmac
        target: internal-hmac
    volumes:
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/router-state
        target: /state
        bind:
          create_host_path: false
    depends_on:
      direct-1:
        condition: service_healthy
      direct-2:
        condition: service_healthy
      direct-3:
        condition: service_healthy
      dataflow-1:
        condition: service_healthy
      dataflow-2:
        condition: service_healthy
      dataflow-3:
        condition: service_healthy
    networks:
      default:
        ipv4_address: ${LOADTEST_ROUTER_IP:-10.89.0.10}
    stop_grace_period: 5m

  load-driver:
    profiles: ["benchmark"]
    image: ghcr.io/mdrakiburrahman/rust-playground/arrowcol-router-rust:dev
    pull_policy: never
    user: "${LOADTEST_UID:?Run through Nx}:${LOADTEST_GID:?Run through Nx}"
    entrypoint: ["/usr/local/bin/arrowcol-loadgen"]
    command: ["run"]
    working_dir: /workspace
    environment:
      LOADTEST_RUN_ID: ${LOADTEST_RUN_ID:-benchmark}
      LOADTEST_WARMUP: ${LOADTEST_WARMUP:-2m}
      LOADTEST_MEASURE: ${LOADTEST_MEASURE:-5m}
      LOADTEST_CAPTURE_SETTLE: ${LOADTEST_CAPTURE_SETTLE:-30s}
      LOADTEST_DRAIN_TIMEOUT: ${LOADTEST_DRAIN_TIMEOUT:-2m}
      LOADTEST_REQUEST_TIMEOUT: ${LOADTEST_REQUEST_TIMEOUT:-1m}
      LOADTEST_CONTINUOUS: ${LOADTEST_CONTINUOUS:-false}
      LOADTEST_KEEP_STACK: ${LOADTEST_KEEP_STACK:-false}
      LOADTEST_LANES: ${LOADTEST_LANES:-4}
      LOADTEST_BATCH_ROWS: ${LOADTEST_BATCH_ROWS:-8192}
      LOADTEST_SEED: ${LOADTEST_SEED:-20260923}
      LOADTEST_SCENARIOS: ${LOADTEST_SCENARIOS:-direct,dataflow,paired}
      LOADTEST_ROUTER_ENDPOINT: http://${LOADTEST_ROUTER_IP:-10.89.0.10}:50050
      LOADTEST_CATALOG_ENDPOINT: http://${LOADTEST_DIRECT_1_IP:-10.89.0.21}:50051
      LOADTEST_RECEIPT_ENDPOINT: http://${LOADTEST_ROUTER_IP:-10.89.0.10}:50050
      LOADTEST_EDGE_SECRET_FILE: /run/secrets/edge-hmac
      LOADTEST_INTERNAL_SECRET_FILE: /run/secrets/internal-hmac
      LOADTEST_RESULTS: /results
      LOADTEST_DIRECT_ROOT: /delta/direct
      LOADTEST_DATAFLOW_ROOT: /delta/dataflow
      LOADTEST_SCRATCH_ROOT: target/loadgen
      ARROWCOL_SDK_GEN: /usr/local/bin/arrowcol-sdk-gen
      ARROWCOL_SQL_HOST: ${LOADTEST_SQL_IP:-10.89.0.2}
      ARROWCOL_SQL_PASSWORD_FILE: /run/secrets/arrowcol-app-password
      LOADTEST_DIRECT_ADMIN_ENDPOINTS: "http://${LOADTEST_DIRECT_1_IP:-10.89.0.21}:8081,http://${LOADTEST_DIRECT_2_IP:-10.89.0.22}:8081,http://${LOADTEST_DIRECT_3_IP:-10.89.0.23}:8081"
      LOADTEST_DATAFLOW_ADMIN_ENDPOINTS: "http://${LOADTEST_DATAFLOW_1_IP:-10.89.0.31}:32011,http://${LOADTEST_DATAFLOW_2_IP:-10.89.0.32}:32011,http://${LOADTEST_DATAFLOW_3_IP:-10.89.0.33}:32011"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${LOADTEST_TRACES_ENDPOINT:-http://tempo:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    secrets:
      - source: arrowcol_app_password
        target: arrowcol-app-password
      - source: edge_hmac
        target: edge-hmac
      - source: internal_hmac
        target: internal-hmac
    volumes:
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/results
        target: /results
        bind:
          create_host_path: false
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/direct
        target: /delta/direct
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/dataflow
        target: /delta/dataflow
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LOADTEST_SCRATCH_HOST_PATH:?Run through benchmark target}
        target: /workspace/target
        bind:
          create_host_path: false
      - type: bind
        source: ${LOADTEST_BIN_HOST_PATH:?Run through benchmark target}/arrowcol-loadgen
        target: /usr/local/bin/arrowcol-loadgen
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LOADTEST_BIN_HOST_PATH:?Run through benchmark target}/arrowcol-sdk-gen
        target: /usr/local/bin/arrowcol-sdk-gen
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      router:
        condition: service_healthy

  validator:
    profiles: ["benchmark"]
    image: ghcr.io/mdrakiburrahman/rust-playground/arrowcol-router-rust:dev
    pull_policy: never
    user: "${LOADTEST_UID:?Run through Nx}:${LOADTEST_GID:?Run through Nx}"
    entrypoint: ["/usr/local/bin/arrowcol-loadgen"]
    command: ["validate"]
    working_dir: /workspace
    environment:
      LOADTEST_RESULTS: /results
      LOADTEST_DIRECT_ROOT: /delta/direct
      LOADTEST_DATAFLOW_ROOT: /delta/dataflow
      LOADTEST_DRAIN_TIMEOUT: ${LOADTEST_DRAIN_TIMEOUT:-2m}
      LOADTEST_REQUIRE_ALL_COLLECTORS: ${LOADTEST_REQUIRE_ALL_COLLECTORS:-true}
    volumes:
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/results
        target: /results
        bind:
          create_host_path: false
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/direct
        target: /delta/direct
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/dataflow
        target: /delta/dataflow
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LOADTEST_BIN_HOST_PATH:?Run through benchmark target}/arrowcol-loadgen
        target: /usr/local/bin/arrowcol-loadgen
        read_only: true
        bind:
          create_host_path: false

secrets:
  sqlserver_sa_password:
    file: ${SQLSERVER_SA_PASSWORD_FILE:-/dev/null}
  arrowcol_app_password:
    file: ${ARROWCOL_APP_PASSWORD_FILE:-/dev/null}
  arrowcol_migrator_password:
    file: ${ARROWCOL_MIGRATOR_PASSWORD_FILE:-/dev/null}
  hive_metastore_password:
    file: ${HIVE_METASTORE_PASSWORD_FILE:-/dev/null}
  edge_hmac:
    file: ${LOADTEST_EDGE_HMAC_FILE:-/dev/null}
  internal_hmac:
    file: ${LOADTEST_INTERNAL_HMAC_FILE:-/dev/null}

volumes:
  sqlserver-data:
  hive-warehouse:

networks:
  default:
    ipam:
      config:
        - subnet: ${LOADTEST_SUBNET:-10.89.0.0/24}
