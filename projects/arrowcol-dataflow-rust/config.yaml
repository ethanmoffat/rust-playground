version: otel_dataflow/v1
engine: {}
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  arrowcol:
    pipelines:
      ingest:
        policies:
          channel_capacity:
            control:
              node: 64
              pipeline: 64
            pdata: 32
        nodes:
          flight:
            type: receiver:arrow_flight
            config:
              listening_addr: "${env:ARROWCOL_FLIGHT_LISTEN:-0.0.0.0:32010}"
              admin_listening_addr: "${env:ARROWCOL_ADMIN_LISTEN:-0.0.0.0:32011}"
              native_quiver: false
              catalog:
                type: sql_hive
                application_database:
                  host: "${env:ARROWCOL_SQL_HOST:-sqlserver}"
                  port: ${env:ARROWCOL_SQL_PORT:-1433}
                  database: "${env:ARROWCOL_SQL_DATABASE:-arrowcol}"
                  username: "${env:ARROWCOL_SQL_USERNAME:-arrowcol_app}"
                  password_file: "${env:ARROWCOL_SQL_PASSWORD_FILE:-/run/secrets/arrowcol-app-password}"
                  trust_server_certificate: ${env:ARROWCOL_SQL_TRUST_CERT:-true}
                  connect_timeout: 15s
                  command_timeout: 30s
                hive_metastore:
                  host: "${env:ARROWCOL_HIVE_HOST:-hive-metastore}"
                  port: ${env:ARROWCOL_HIVE_PORT:-9083}
                  warehouse_root: "${env:ARROWCOL_HIVE_WAREHOUSE:-file:///opt/hive/data/warehouse}"
                  owner: arrowcol
                  connect_timeout: 10s
                timestamp_timezone: UTC
              routing:
                type: sql_server
                connection:
                  host: "${env:ARROWCOL_SQL_HOST:-sqlserver}"
                  port: ${env:ARROWCOL_SQL_PORT:-1433}
                  database: "${env:ARROWCOL_SQL_DATABASE:-arrowcol}"
                  username: "${env:ARROWCOL_SQL_USERNAME:-arrowcol_app}"
                  password_file: "${env:ARROWCOL_SQL_PASSWORD_FILE:-/run/secrets/arrowcol-app-password}"
                  trust_server_certificate: ${env:ARROWCOL_SQL_TRUST_CERT:-true}
                  connect_timeout: 15s
                  command_timeout: 30s
              registration:
                instance_key: "${env:ARROWCOL_INSTANCE_KEY:-arrowcol-dataflow-local}"
                flight_endpoint: "${env:ARROWCOL_ADVERTISED_FLIGHT_ENDPOINT:-127.0.0.1:32010}"
                max_concurrent_streams: 128
                heartbeat_interval: 5s
                pressure_interval: 2s
                registration_ttl: 20s
                rss_limit_bytes: 2147483648
                buffered_bytes_limit: 536870912
                buffered_rows_limit: 10000000
                buffered_batches_limit: 4096
              limits:
                max_metadata_bytes: 16384
                max_schema_bytes: 1048576
                max_message_bytes: ${env:ARROWCOL_MAX_MESSAGE_BYTES:-16777216}
                batch_channel_capacity: 4
                put_result_channel_capacity: 8
                max_stream_duration: 5m
                admission_timeout: 30s
                max_ddl_bytes: 65536
          delta:
            type: exporter:arrow_deltalake
            config:
              base_path: "${env:ARROWCOL_DELTA_ROOT:-/onelake}"
              routing:
                type: sql_server
                connection:
                  host: "${env:ARROWCOL_SQL_HOST:-sqlserver}"
                  port: ${env:ARROWCOL_SQL_PORT:-1433}
                  database: "${env:ARROWCOL_SQL_DATABASE:-arrowcol}"
                  username: "${env:ARROWCOL_SQL_USERNAME:-arrowcol_app}"
                  password_file: "${env:ARROWCOL_SQL_PASSWORD_FILE:-/run/secrets/arrowcol-app-password}"
                  trust_server_certificate: ${env:ARROWCOL_SQL_TRUST_CERT:-true}
                  connect_timeout: 15s
                  command_timeout: 30s
              commit:
                batch_window: 2s
                max_files_per_commit: 16
                max_pending_files: 64
              authority_timeout: 10s
        connections:
          - from: flight
            to: delta
