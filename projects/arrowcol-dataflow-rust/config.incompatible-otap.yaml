version: otel_dataflow/v1
engine: {}
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  arrowcol:
    pipelines:
      ingest:
        nodes:
          flight:
            type: receiver:arrow_flight
            config:
              listening_addr: "127.0.0.1:32210"
              admin_listening_addr: "127.0.0.1:32211"
              catalog:
                type: memory
              routing:
                type: memory
              registration:
                instance_key: incompatible-otap
                flight_endpoint: "127.0.0.1:32210"
          durable:
            type: processor:durable_buffer
            config:
              path: /onelake/quiver
              poll_interval: 100ms
              max_age: 1h
              retention_size_cap: 1GB
              size_cap_policy: backpressure
              otlp_handling: pass_through
          delta:
            type: exporter:arrow_deltalake
            config:
              base_path: /onelake
              routing:
                type: memory
        connections:
          - from: flight
            to: durable
          - from: durable
            to: delta
