version: otel_dataflow/v1
engine: {}
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  arrowcol:
    pipelines:
      ingest:
        nodes:
          flight:
            type: receiver:arrow_flight
            config:
              listening_addr: "127.0.0.1:32210"
              admin_listening_addr: "127.0.0.1:32211"
              catalog:
                type: memory
              routing:
                type: memory
              registration:
                instance_key: incompatible-otap
                flight_endpoint: "127.0.0.1:32210"
          otap_batch:
            type: processor:batch
            config: {}
          delta:
            type: exporter:arrow_deltalake
            config:
              base_path: /onelake
              routing:
                type: memory
        connections:
          - from: flight
            to: otap_batch
          - from: otap_batch
            to: delta
