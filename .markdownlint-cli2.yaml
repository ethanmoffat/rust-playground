config:
  MD013: false
  MD033: false
gitignore: true
globs:
  - "**/*.{md,markdown,MD,MARKDOWN}"
ignores:
  - "**/node_modules/**"
  - "submodules/**"
  - "**/.git/**"
  - "**/.nx/**"
  - "**/.temp/**"
  - "**/target/**"
  - "**/dist/**"
  - "**/coverage/**"
overrides:
  # PR templates are sections appended to a GitHub-provided title.
  - filter:
      - ".github/pull_request_template.md"
    config:
      MD041: false
    combine: merge
